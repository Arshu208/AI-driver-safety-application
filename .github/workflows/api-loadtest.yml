name: API Load Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  loadtest:
    name: API load test
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm ci
        working-directory: backend
      - run: npm run build
        working-directory: backend
      - name: Start backend
        env:
          MONGO_URI: mongodb://127.0.0.1:27017/ridesafe
          PORT: 5000
          RIDESAFE_OFFLINE: true
        run: |
          cd backend
          nohup npm start > "$RUNNER_TEMP/backend.log" 2>&1 &
          for i in {1..30}; do curl --fail http://127.0.0.1:5000/api/health && break || sleep 2; done
      - name: Seed load-test driver
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST http://127.0.0.1:5000/api/auth/register \
            -H 'Content-Type: application/json' \
            --data '{"name":"CI Driver","phone":"9999999999","email":"ci-driver@example.com","password":"Test@123","vehicleNumber":"CI-001","emergencyContact":"9999999998"}' \
            || test $? -eq 22
      - name: Run API load test
        env:
          RIDESAFE_API_URL: http://127.0.0.1:5000/api
          LOAD_TEST_USERS: 10
          LOAD_TEST_DURATION_MS: 10000
        run: node load-tests/loadtest.js
      - name: Validate checked-in load report
        run: node ci/validate-pass-reports.mjs load-tests/LoadTest_Report.xlsx
      - name: Upload load-test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-loadtest-results
          path: |
            load-tests/LoadTest_Report.xlsx
            ${{ runner.temp }}/backend.log